<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FL-200</title>

<style>
:root{
    --bg:#050811;
    --card:#0c1220;
    --card2:#101827;
    --border:#24324b;
    --text:#eef4ff;
    --muted:#7f8da5;
    --green:#20e39b;
    --blue:#4d8dff;
    --red:#ff526d;
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    min-height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:
        Inter,
        Segoe UI,
        Arial,
        sans-serif;
}

body{
    min-height:100vh;
}


/* =========================================================
   LOGIN FACE
========================================================= */

#loginFace{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(77,141,255,.12),
            transparent 35%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(32,227,155,.06),
            transparent 35%
        ),
        var(--bg);
}

.login-card{
    width:min(410px,100%);

    padding:34px;

    background:
        linear-gradient(
            145deg,
            rgba(16,24,39,.97),
            rgba(8,13,23,.97)
        );

    border:1px solid var(--border);

    border-radius:22px;

    box-shadow:
        0 30px 100px rgba(0,0,0,.55),
        0 0 60px rgba(77,141,255,.05);
}

.logo{
    text-align:center;

    font-size:30px;

    font-weight:900;

    letter-spacing:.5px;
}

.logo-icon{
    display:inline-flex;

    width:42px;
    height:42px;

    align-items:center;
    justify-content:center;

    margin-right:7px;

    border-radius:12px;

    background:
        linear-gradient(
            145deg,
            var(--blue),
            var(--green)
        );

    color:#061019;

    font-size:23px;

    vertical-align:middle;

    box-shadow:
        0 0 25px rgba(32,227,155,.18);
}

.subtitle{
    text-align:center;

    color:var(--muted);

    font-size:11px;

    letter-spacing:1.8px;

    margin-top:10px;

    margin-bottom:28px;
}

.token-label{
    color:var(--muted);

    font-size:11px;

    margin-bottom:7px;

    letter-spacing:.5px;
}

#tokenInput{
    width:100%;

    height:52px;

    padding:0 15px;

    border-radius:11px;

    border:1px solid var(--border);

    outline:none;

    background:#060b14;

    color:white;

    font-size:13px;

    transition:.2s;
}

#tokenInput:focus{
    border-color:var(--blue);

    box-shadow:
        0 0 0 3px rgba(77,141,255,.10);
}

#unlockBtn{
    width:100%;

    height:50px;

    margin-top:13px;

    border:0;

    border-radius:11px;

    cursor:pointer;

    background:var(--green);

    color:#04140e;

    font-size:13px;

    font-weight:900;

    letter-spacing:.6px;

    transition:.2s;
}

#unlockBtn:hover{
    filter:brightness(1.08);
}

#unlockBtn:disabled{
    opacity:.6;

    cursor:wait;
}

#error{
    min-height:18px;

    margin-top:12px;

    color:var(--red);

    font-size:11px;

    text-align:center;

    line-height:1.5;
}

.security-note{
    margin-top:18px;

    color:#65748d;

    font-size:10px;

    line-height:1.6;

    text-align:center;
}


/* =========================================================
   APP
========================================================= */

#app{
    display:none;

    min-height:100vh;

    padding:18px;
}

.app-shell{
    max-width:1500px;

    margin:0 auto;
}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{
    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    padding:15px 18px;

    background:var(--card);

    border:1px solid var(--border);

    border-radius:15px;

    margin-bottom:16px;
}

.brand{
    font-size:17px;

    font-weight:900;
}

.brand-sub{
    color:var(--muted);

    font-size:10px;

    margin-top:3px;
}

.live{
    display:flex;

    align-items:center;

    gap:7px;

    color:var(--green);

    font-size:10px;

    font-weight:800;

    letter-spacing:.5px;
}

.live-dot{
    width:7px;
    height:7px;

    border-radius:50%;

    background:var(--green);

    box-shadow:
        0 0 12px var(--green);
}

#logoutBtn{
    padding:9px 14px;

    border-radius:9px;

    border:1px solid #523041;

    background:#20151f;

    color:#ff8fa2;

    cursor:pointer;

    font-size:10px;

    font-weight:800;
}

#logoutBtn:hover{
    background:#2b1b28;
}


/* =========================================================
   JSON DASHBOARD
========================================================= */

#face{
    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(230px,1fr)
        );

    gap:14px;
}

.json-card{
    background:var(--card);

    border:1px solid var(--border);

    border-radius:14px;

    padding:18px;

    min-height:115px;

    overflow:hidden;
}

.json-key{
    color:var(--muted);

    font-size:10px;

    text-transform:uppercase;

    letter-spacing:1px;

    margin-bottom:10px;
}

.json-value{
    color:var(--text);

    font-size:18px;

    font-weight:800;

    line-height:1.4;

    word-break:break-word;

    white-space:pre-wrap;
}

.json-object{
    color:#cbd7ea;

    font-family:
        Consolas,
        Monaco,
        monospace;

    font-size:11px;

    line-height:1.55;

    font-weight:400;

    overflow:auto;

    max-height:300px;
}


/* =========================================================
   HEART STATUS
========================================================= */

#heart{
    margin-top:15px;

    padding:12px 15px;

    border:1px solid rgba(32,227,155,.14);

    border-radius:11px;

    background:rgba(32,227,155,.035);

    color:var(--muted);

    font-size:10px;
}

#heart strong{
    color:var(--green);
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    .login-card{
        padding:25px;
    }

    #app{
        padding:10px;
    }

    .topbar{
        flex-wrap:wrap;
    }

    .brand{
        width:100%;
    }

}
</style>
</head>


<body>


<!-- =======================================================
     LOGIN
======================================================= -->

<div id="loginFace">

    <div class="login-card">

        <div class="logo">
            <span class="logo-icon">⚡</span>
            FL-200
        </div>

        <div class="subtitle">
            SECURE PRIVATE FACE
        </div>


        <div class="token-label">
            GITHUB FINE-GRAINED READ-ONLY TOKEN
        </div>


        <input
            id="tokenInput"
            type="password"
            autocomplete="off"
            spellcheck="false"
            placeholder="github_pat_••••••••••••"
        >


        <button id="unlockBtn">
            UNLOCK
        </button>


        <div id="error"></div>


        <div class="security-note">
            Token is used only in this browser session.
            <br>
            Required permission:
            <b>Contents → Read-only</b>
        </div>

    </div>

</div>


<!-- =======================================================
     APP
======================================================= -->

<div id="app">

    <div class="app-shell">

        <div class="topbar">

            <div>
                <div class="brand">
                    ⚡ FL-200
                </div>

                <div class="brand-sub">
                    PRIVATE HEART · JSON LIVE DATA
                </div>
            </div>


            <div class="live">

                <span class="live-dot"></span>

                <span id="connection">
                    LIVE · 4s
                </span>

            </div>


            <button id="logoutBtn">
                LOGOUT
            </button>

        </div>


        <div id="face"></div>


        <div id="heart">

            <strong>♥ HEART</strong>

            <span id="heartText">
                Waiting for private repository...
            </span>

        </div>

    </div>

</div>


<script>
"use strict";


/* =========================================================
   CONFIG
========================================================= */

/*
 * YOUR PRIVATE GITHUB REPOSITORY
 */

const CONFIG = {

    OWNER: "MFJ-TRADING",

    REPO: "FL-200-Private",

    BRANCH: "main",

    /*
     * Change this to your JSON file.
     *
     * Example:
     *
     * data/live.json
     *
     * or:
     *
     * live.json
     */

    JSON_FILE: "data/live.json",

    /*
     * 4 seconds
     */

    HEARTBEAT: 4000

};


/* =========================================================
   ELEMENTS
========================================================= */

const loginFace =
    document.getElementById("loginFace");

const app =
    document.getElementById("app");

const tokenInput =
    document.getElementById("tokenInput");

const unlockBtn =
    document.getElementById("unlockBtn");

const logoutBtn =
    document.getElementById("logoutBtn");

const errorBox =
    document.getElementById("error");

const face =
    document.getElementById("face");

const connection =
    document.getElementById("connection");

const heartText =
    document.getElementById("heartText");


/* =========================================================
   STATE
========================================================= */

let FACE_TOKEN = "";

let heartTimer = null;

let requestController = null;

let loggedIn = false;

let requestRunning = false;


/* =========================================================
   GITHUB JSON URL
========================================================= */

function getGitHubURL(){

    return (
        "https://api.github.com/repos/" +
        encodeURIComponent(CONFIG.OWNER) +
        "/" +
        encodeURIComponent(CONFIG.REPO) +
        "/contents/" +
        CONFIG.JSON_FILE +
        "?ref=" +
        encodeURIComponent(CONFIG.BRANCH)
    );

}


/* =========================================================
   GITHUB REQUEST
========================================================= */

async function getPrivateJSON(){

    if(!FACE_TOKEN){

        throw new Error(
            "FACE_TOKEN missing."
        );

    }


    if(requestController){

        requestController.abort();

    }


    requestController =
        new AbortController();


    const response =
        await fetch(
            getGitHubURL(),
            {

                method:"GET",

                signal:
                    requestController.signal,

                cache:"no-store",

                headers:{

                    "Accept":
                        "application/vnd.github+json",

                    "Authorization":
                        "Bearer " + FACE_TOKEN,

                    "X-GitHub-Api-Version":
                        "2022-11-28"

                }

            }
        );


    if(!response.ok){

        let message =
            "GitHub HTTP " +
            response.status;

        try{

            const info =
                await response.json();

            if(info.message){

                message +=
                    " — " +
                    info.message;

            }

        }catch(_){}


        throw new Error(message);

    }


    const githubFile =
        await response.json();


    if(!githubFile.content){

        throw new Error(
            "JSON file content not found."
        );

    }


    /*
     * GitHub returns Base64.
     */

    const clean =
        githubFile.content
            .replace(/\s/g,"");


    const binary =
        atob(clean);


    const bytes =
        Uint8Array.from(
            binary,
            char =>
                char.charCodeAt(0)
        );


    const decoded =
        new TextDecoder(
            "utf-8"
        ).decode(bytes);


    try{

        return JSON.parse(decoded);

    }catch(_){

        throw new Error(
            "Private file contains invalid JSON."
        );

    }

}


/* =========================================================
   SAFE VALUE RENDER
========================================================= */

function renderValue(value){

    if(
        value !== null &&
        typeof value === "object"
    ){

        const pre =
            document.createElement("pre");

        pre.className =
            "json-object";

        pre.textContent =
            JSON.stringify(
                value,
                null,
                2
            );

        return pre;

    }


    const div =
        document.createElement("div");

    div.className =
        "json-value";

    div.textContent =
        value === null ||
        value === undefined
            ? ""
            : String(value);

    return div;

}


/* =========================================================
   JSON → DASHBOARD
========================================================= */

function renderDashboard(data){

    face.replaceChildren();


    if(
        data === null ||
        data === undefined
    ){

        return;

    }


    /*
     * If JSON itself is an array,
     * display it as one object.
     */

    if(Array.isArray(data)){

        data = {
            data:data
        };

    }


    /*
     * If JSON is primitive.
     */

    if(typeof data !== "object"){

        data = {
            result:data
        };

    }


    const entries =
        Object.entries(data);


    for(
        const [key,value]
        of entries
    ){

        const card =
            document.createElement("div");

        card.className =
            "json-card";


        const keyElement =
            document.createElement("div");

        keyElement.className =
            "json-key";

        keyElement.textContent =
            key;


        const valueElement =
            renderValue(value);


        card.append(
            keyElement,
            valueElement
        );


        face.appendChild(card);

    }

}


/* =========================================================
   HEARTBEAT
========================================================= */

async function heartbeat(){

    if(
        !loggedIn ||
        !FACE_TOKEN ||
        requestRunning
    ){

        return;

    }


    requestRunning = true;


    try{

        const data =
            await getPrivateJSON();


        /*
         * Logout ke baad agar request late
         * return ho to data render NA ho.
         */

        if(!loggedIn){

            return;

        }


        renderDashboard(data);


        connection.textContent =
            "LIVE · 4s";


        heartText.textContent =
            "Connected · Last sync: " +
            new Date()
                .toLocaleTimeString();


    }catch(error){

        if(
            error.name ===
            "AbortError"
        ){

            return;

        }


        if(!loggedIn){

            return;

        }


        connection.textContent =
            "ERROR";


        heartText.textContent =
            error.message;

    }finally{

        requestRunning = false;

    }

}


/* =========================================================
   START HEART
========================================================= */

function startHeart(){

    stopHeart();


    /*
     * First request immediately.
     */

    heartbeat();


    /*
     * Then every 4 seconds.
     */

    heartTimer =
        setInterval(
            heartbeat,
            CONFIG.HEARTBEAT
        );

}


/* =========================================================
   STOP HEART
========================================================= */

function stopHeart(){

    if(heartTimer){

        clearInterval(
            heartTimer
        );

        heartTimer = null;

    }


    if(requestController){

        requestController.abort();

        requestController = null;

    }

}


/* =========================================================
   UNLOCK
========================================================= */

async function unlock(){

    errorBox.textContent = "";


    const token =
        tokenInput.value.trim();


    if(!token){

        errorBox.textContent =
            "Please enter your GitHub read-only token.";

        return;

    }


    unlockBtn.disabled = true;

    unlockBtn.textContent =
        "CONNECTING...";


    /*
     * Token sirf memory mein.
     * localStorage mein save NAHI kar rahe.
     */

    FACE_TOKEN = token;


    try{

        /*
         * Token verify + first JSON load.
         */

        const data =
            await getPrivateJSON();


        /*
         * Login successful.
         */

        loggedIn = true;


        /*
         * Token input clear.
         */

        tokenInput.value = "";


        /*
         * Login face hide.
         */

        loginFace.style.display =
            "none";


        /*
         * App show.
         */

        app.style.display =
            "block";


        /*
         * First dashboard.
         */

        renderDashboard(data);


        connection.textContent =
            "LIVE · 4s";


        heartText.textContent =
            "Connected · Last sync: " +
            new Date()
                .toLocaleTimeString();


        /*
         * Start 4 second heart.
         */

        startHeart();


    }catch(error){

        FACE_TOKEN = "";

        loggedIn = false;


        errorBox.textContent =
            error.message;


        unlockBtn.disabled = false;

        unlockBtn.textContent =
            "UNLOCK";

        return;

    }


    unlockBtn.disabled = false;

    unlockBtn.textContent =
        "UNLOCK";

}


/* =========================================================
   LOGOUT
========================================================= */

function logout(){

    /*
     * IMPORTANT:
     * Sab se pehle polling stop.
     */

    loggedIn = false;


    stopHeart();


    /*
     * Token memory se destroy.
     */

    FACE_TOKEN = "";


    /*
     * Dashboard completely destroy.
     */

    app.replaceChildren();


    /*
     * App hidden.
     */

    app.style.display =
        "none";


    /*
     * Login face back.
     */

    loginFace.style.display =
        "flex";


    /*
     * Error clear.
     */

    errorBox.textContent = "";


    /*
     * Token input empty.
     */

    tokenInput.value = "";


    /*
     * Browser back/cache se old dashboard
     * visible na rahe.
     */

    connection.textContent =
        "LIVE · 4s";

    heartText.textContent =
        "Waiting for private repository...";

}


/* =========================================================
   EVENTS
========================================================= */

unlockBtn.addEventListener(
    "click",
    unlock
);


logoutBtn.addEventListener(
    "click",
    logout
);


tokenInput.addEventListener(
    "keydown",
    event => {

        if(event.key === "Enter"){

            unlock();

        }

    }
);


/* =========================================================
   INITIAL STATE
========================================================= */

/*
 * Public face par start mein sirf LOGIN.
 */

loginFace.style.display =
    "flex";

app.style.display =
    "none";

</script>

</body>
</html>
